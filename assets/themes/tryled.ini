ItemDownStyleBg = "#00C4DBFF"
ItemDisabledStyleFg = "#6B7686FF"
ItemDisabledStyleBg = "#0D111780"
HeaderStyleFg = "#00E5FFFF"
HeaderStyleBg = "#00000000"
InfoStyleFg = "#F2F7FFFF"
InfoStyleBg = "#00000000"
PopupStyleFg = "#F2F7FFFF"
PopupStyleBg = "#0D1117FF"
PopupTitleStyleFg = "#00E5FFFF"
PopupTitleStyleBg = "#00000000"
CollapsibleHeaderStyleFg = "#00E5FFFF"
CollapsibleHeaderStyleBg = "#0D1117FF"
TooltipStyleFg = "#F2F7FFFF"
TooltipStyleBg = "#0D1117E0"
BackgroundColor = "#000000FF"
ScrollbarColor = "#00E5FF80"
PopupSliderColor = "#FFFFFFFF"
PopupSliderFocusedColor = "#00E5FFFF"
TouchButtonStyle = 1
TouchButtonOpacity = 30
TouchButtonColor = "#FFFFFFFF"
TouchButtonIconColor = "#FFFFFFFF"
BackgroundAnimation = 0

