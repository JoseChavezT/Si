# Temas de Tryled.
# Además de los colores del menú, cada tema define cómo se ven los controles
# táctiles y el fondo, para que toda la app siga el mismo estilo:
#   TouchButtonStyle     0 = relleno, 1 = solo contorno, 2 = contorno con brillo al pulsar
#   TouchButtonOpacity   0-100
#   TouchButtonColor     color del botón ("#RRGGBBAA")
#   TouchButtonIconColor color del símbolo dentro del botón
#   BackgroundAnimation  0 = sin animación, 1 = símbolos flotantes, 3 = ondas, 6 = símbolos de colores
# Colores en formato "#RRGGBBAA".

[TryledNegroTotal]
Name = "Negro total"
Description = "Negro puro con cian y magenta. Controles fantasma. Ideal para AMOLED."
ItemStyleFg = "#F2F7FFFF"
ItemStyleBg = "#0D1117FF"
